[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-trace"
version = "0.1.0"
description = "言迹 ContextTrace —— 可追溯的 Agent 长期记忆层"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
  "pyseekdb",
  "PyMySQL>=1.1,<2",
  "pydantic>=2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy",
  "httpx>=0.27,<1",
]
mcp = [
  "mcp>=2.3,<3",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"yanji.store" = ["schema.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
